<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Tutorial - Entrega 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Fredoka', cursive, sans-serif;
      background: #fdf2f8 url('https://images.unsplash.com/photo-1526047932273-341f2a7631f9?q=80&w=1600&auto=format&fit=crop') center/cover fixed no-repeat;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
      overflow-x: hidden;
    }

    /* Marco exterior metálico rosado estilo Nokia/Consola */
    .frame {
      width: 900px;
      max-width: 98vw;
      background: linear-gradient(135deg, 
          #fce7f3 0%, 
          #f472b6 20%, 
          #f43f5e 45%, 
          #fda4af 55%, 
          #e11d48 80%, 
          #881337 100%);
      border: 4px solid #fff1f2;
      border-radius: 40px;
      padding: 20px;
      box-shadow: 0 30px 60px rgba(136, 19, 55, 0.4), inset 0 4px 10px rgba(255, 255, 255, 0.9);
      position: relative;
    }

    /* Pantalla interna morada */
    .board {
      background-color: #2e1065;
      border: 3px solid #fecdd3;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
      color: #fff;
    }

    header {
      text-align: center;
      border-bottom: 2px dashed rgba(255,255,255,0.3);
      padding-bottom: 12px;
      width: 100%;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    p.subtitle {
      color: #fef08a;
      font-size: 0.9rem;
      margin-top: 4px;
      font-weight: 600;
    }

    /* Contenedor del reproductor de video */
    .video-wrapper {
      position: relative;
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #fecdd3;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-wrapper video {
      width: 100%;
      max-height: 480px;
      display: block;
      outline: none;
    }

    .btn-back {
      background: linear-gradient(180deg, #ffffff 0%, #ffe4e6 60%, #f472b6 100%);
      color: #881337;
      text-decoration: none;
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 20px;
      border: 1px solid #fda4af;
      box-shadow: 0 4px 0 #be185d, 0 5px 8px rgba(0,0,0,0.25);
      transition: all 0.1s ease;
      margin-top: 6px;
      font-size: 0.85rem;
    }

    .btn-back:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #be185d;
    }
  </style>
</head>
<body>

  <div class="frame">
    <div class="board">

      <header>
        <h1>🎬 Video Tutorial</h1>
        <p class="subtitle">Sintetizador en Max</p>
      </header>

      <!-- Reproductor Local en Marco del Portafolio -->
      <div class="video-wrapper">
        <video controls preload="metadata">
          <source src="tutorial.mp4" type="video/mp4">
          Tu navegador no soporta la reproducción de video HTML5.
        </video>
      </div>

      <a href="../index.html" class="btn-back">🔙 VOLVER AL PORTAFOLIO</a>

    </div>
  </div>

</body>
</html>
